<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo Aula09 - HTML</title>

    <body>

<h1>Definindo imagens no HTML</h1>

<img src="img/renascinamento html.jpg" alt="renascinamento" width="350" height="180">

 <hr>
 
 <h3>Definindo altura e largura de imagem com o CSS</h3>

 <img src="img/renascinamento html.jpg" alt="renascinamento" style="width: 350px; height: 180px;">

 <hr>

 <h3>Utilizando imagens dinâmicas no HTML</h3>

 <img src="img/monala meme.gif" style="width: 180px; height: 100px;">

 <hr>

 <h3>Utilizando imagem flutuante</h3>

 <p>
    <img src="img/monala meme.gif" style="width: 110px; height: 100px; float: right;">
    Viva a vida é uma festa.
 </p>
