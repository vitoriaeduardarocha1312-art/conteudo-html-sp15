     /* Transformando link em botão com estilos */
     
     a:link, a:visited {
        background-color: crimson;
        color: bisque;
        text-decoration: none;
        padding: 15px 25px;
        display: inline-block;
        border: 4px solid #000;
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        
        }

        a:hover, a:active {
        background-color: bisque;
        color: #000;
        border: 4px solid crimson;
        transition: .3s;
      }

      a:active {
        box-shadow: inset 0 0 2px 0 #000000;
      }

     </style>
    
    </head>
    <body>

     <h1>Mudando estilo de link</h1>

     <a href="###">Isso é um link</a>

     <hr>

     <h3>Definindo estilo de link</h3>

     <a href="###">Isso é um link</a>

     <hr>

     <h3>definindo estilo de botão em link</h3>

     <a href="###">link</a>

    </body>
