<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo Aula13 - HTML</title>
    
      <style>
  
       #meu-h2 {
        background-color: maroon;
        color: darkorchid;
        padding: 10px;
        border: 4px solid darkorchid;
       }

      </style>
    
    
    </head>
    <body>

    <h1>ID no HTML</h1>

    <h2 id="meu-h2">Eu sou um h2 com ID</h2>

    <hr>

    <h3>Id com JavaScript</h3>

    <h4 id="meu-h4">Truma SP15</h4>

    <button onclick="mudarConteudo()">Alterar conteudo</button>

    <script>

         function mudarConteudo() {
            document.getElementById("meu-h4").innerHTML = "Viva a vida é uma festa";
            document.getElementById("meu-h4").style.color = "violet";
            document.getElementById("meu-h4").style.fontSize = "30px";
         }

    </script>


    </body>
</html>
