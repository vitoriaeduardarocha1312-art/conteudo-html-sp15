<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo Aula13 - HTML</title>
    
    <style>

      .importante {
      }

      .cidades {
        background-color: aquamarine;
        border: 6px solid darkmagenta;
        color:black;
        padding: 10px;
      }

      .centralizado {
        text-align: center
      }

      .estilo {
        background-color: pink;
        color:blue;
        padding: 10px;
        border: 4px solid green;
      }

    </style>
    
    
        <head>
    <body>

   <h1>Class em HTML</h1>
   
   <h2>Titulo <span class="importante">importante</span> no HTML</h2>

   <p>Exemplo de conteudo <span class="importante">importante</span> no HTML</p>

   <hr>

   <h3>Definindo mais de uma classe para elementos</h3>

   <h2 class="cidades centralizado">São paulo</h2>

   <h2 class="cidades">Rio de janeiro</h2>

   <h2 class="cidades">Natal</h2>

   <hr>

   <h3>Mmesmas classes em elementos diferentes</h3>
   
   <h2 class="estilo">Eu sou um h2</h2>

   <p class="estilo">Eu sou um paragrafo</p>

   <hr>

   

    </body>
</html>
