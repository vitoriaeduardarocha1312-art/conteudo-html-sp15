<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo Aula10 HTML</title>
    </head>
    <body>


    <h1>Definindo Listas no HTML</h1>

    <h3>Exemplo de lista Não Ordenada</h3>

    <ul>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ul>

    <hr>

    <h3>Exemplo de lista Cordenada</h3>

    <ol>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ol>


    </body>
</html>
